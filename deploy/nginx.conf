# DrawDraw: nginx configuration for the website. Include this file from the http {} block (for
# example from /etc/nginx/conf.d/), then set server_name, root and the certificate paths.
# Netlify and Cloudflare Pages read public/_headers instead; Apache: public/.htaccess. The values
# are the same in all three, and __tests__/website.test.ts fails when they are not; e2e/hosts.mjs
# (in npm run test:e2e) loads this file into a real nginx and checks what it sends. Written for a
# site at the root of its domain: under a sub-path, prefix the locations and error_page with it.
# The /api/ location proxies to the site's API, server/start.mjs on 127.0.0.1:8788 (README.md,
# "Sign in and Pro on the website"); without it running, api/ answers 502 with the site's 404 page
# and every header, and the page shows no account.
# HTTP/2 is the `http2` parameter of `listen`, not the `http2 on;` directive: that directive
# arrived in nginx 1.25.1, and 1.24 (Ubuntu 24.04 LTS's) refuses the whole file over it. From
# 1.25.1 on, nginx -t warns that the parameter is deprecated, which is harmless.

# The bundle's name carries a hash of its contents, so it can be cached for a year. Every other
# file keeps its name across builds and is revalidated on every load (an unchanged one costs a 304).
map $uri $drawdraw_cache_control {
  default            "no-cache";
  ~^/_expo/static/   "public, max-age=31536000, immutable";
}

server {
  listen 80;
  listen [::]:80;
  server_name example.com;
  server_tokens off;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name example.com;

  # The contents of the folder `npm run build:web` writes (.web-build/). Never a git checkout.
  root /var/www/drawdraw;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  server_tokens off;
  autoindex off;
  charset utf-8;

  # A missing page, and anything refused below, shows the site's own 404 page.
  error_page 404 /404.html;
  error_page 403 =404 /404.html;

  # The site is exactly these files. Everything else is a 404: dotfiles, the host configs the
  # build leaves beside the site (_headers, _redirects, .htaccess), a folder that would list,
  # and anything of the repository's that was copied up by mistake.
  location = / {
    try_files /index.html =404;
  }
  location ~ ^/(index\.html|404\.html|guard\.js|site\.css|favicon\.ico|robots\.txt|\.well-known/security\.txt|_expo/static/[A-Za-z0-9/_.-]*[A-Za-z0-9_.-])$ {
    try_files $uri =404;
  }
  location / {
    return 404;
  }

  # The site's API (server/start.mjs: sign in with Google, the shop and Stripe's webhook, each off
  # until its variables are set), on the same origin. ^~ wins over the regular expression above,
  # and proxy_pass has no URI, so the path reaches the API unchanged. Answers 502 while it is not
  # running, which the page reads as no account: it draws no sign-in and no shop.
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    client_max_body_size 1m;
    proxy_read_timeout 30s;
    # What nginx answers here itself, the API not running (502) or not answering in time (504), is
    # the site's 404 page, which the allow-list above serves with every header below; the status
    # stays. nginx's own error page would go out with this location's one header alone. The API's
    # own answers, its errors included, pass through untouched.
    error_page 502 504 /404.html;
    # The one add_header in a location, and the reason it is here: with one of its own, a location
    # inherits none of the server's below, so the API's own headers go out alone (two
    # Content-Security-Policy or Referrer-Policy values would otherwise be sent, and the site's
    # Cache-Control beside the API's). This repeats the server's Strict-Transport-Security line.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Every header is set here, for the whole server, and in no location but /api/'s above: a
  # location with even one add_header of its own drops all of these for the paths it matches.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "accelerometer=(), attribution-reporting=(), autoplay=(), browsing-topics=(), camera=(), captured-surface-control=(), clipboard-read=(), clipboard-write=(), compute-pressure=(), deferred-fetch=(), deferred-fetch-minimal=(), digital-credentials-get=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), join-ad-interest-group=(), keyboard-map=(), language-detector=(), local-fonts=(), local-network-access=(), magnetometer=(), microphone=(), midi=(), on-device-speech-recognition=(), otp-credentials=(), payment=(), picture-in-picture=(), private-aggregation=(), private-state-token-issuance=(), private-state-token-redemption=(), publickey-credentials-create=(), publickey-credentials-get=(), run-ad-auction=(), screen-wake-lock=(), serial=(), shared-storage=(), shared-storage-select-url=(), storage-access=(), summarizer=(), sync-xhr=(), translator=(), usb=(), web-share=(), window-management=(), xr-spatial-tracking=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control $drawdraw_cache_control always;
}
