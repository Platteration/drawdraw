name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run test:conventions

      # The Expo CLI refuses an output directory outside the project, so the bundle
      # lands in .export-check (ignored) rather than /tmp.
      - run: npx expo export --platform ios --platform android --output-dir .export-check

      - run: npm run icons:check

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
