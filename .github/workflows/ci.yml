name: CI

on:
  push:
    branches:
      - claude/portrait-segmentation-overlay-4kh36c
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      # Informative, not a gate. The advisories in this tree sit inside Expo's
      # own dependencies (braces, node-forge, and sprintf-js), with no patched
      # upstream release available. Expo and its CLI are in `dependencies`, so a
      # blocking audit would fail every PR on the first high advisory upstream.
      # --omit=dev is not used for the same reason: it would hide nothing of
      # Expo's and only skip the test tooling.
      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
      # Pinned so a new expo-doctor release cannot change what CI checks. Two of
      # its checks (the app.json schema, fetched from exp.host, and the package
      # metadata from reactnative.directory) need network and fail spuriously
      # without it, so this step reports rather than blocks.
      - name: Expo project health (non-blocking)
        run: npx expo-doctor@1.20.4
        continue-on-error: true
      - name: Unit tests
        run: npx jest --ci
      - name: Bundle for iOS and Android
        run: npx expo export --platform ios --platform android --output-dir .export-check
      - name: Icons still match the model
        run: npm run icons:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the app in a browser
        run: npm run e2e
