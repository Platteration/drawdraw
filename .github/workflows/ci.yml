name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, for a tree nobody pushes to: GitHub runs a schedule from the default branch
  # only, where an advisory or a build that has rotted then shows within a week. Not at
  # the top of the hour, a high-load time when scheduled runs can be delayed or dropped
  # (CONVENTIONS.md, "CI").
  schedule:
    - cron: "17 6 * * 1"

# A newer run for the same ref supersedes an in-flight one. On the default branch the
# weekly run shares the group with pushes; whichever is cancelled, the other tests the
# branch's newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      # Check runtime and test tooling. High/critical advisories remain blocking
      # until resolved or handled through a documented, scoped exception.
      - name: Dependency audit
        run: npm audit --audit-level=high
      # Pinned so a new expo-doctor release cannot change what CI checks. Two of
      # its checks (the app.json schema, fetched from exp.host, and the package
      # metadata from reactnative.directory) need network and fail spuriously
      # without it, so this step reports rather than blocks.
      - name: Expo project health (non-blocking)
        run: npx expo-doctor@1.20.4
        continue-on-error: true
      - name: Unit tests
        run: npx jest --ci
      - name: Bundle for iOS and Android
        run: npx expo export --platform ios --platform android --output-dir .export-check
      - name: Icons still match the model
        run: npm run icons:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:conventions

      # The two platforms the app ships to. The bundle lands in .export-check,
      # which .gitignore and eslint.config.js both leave alone.
      - run: npx expo export --platform ios --platform android --output-dir .export-check

      - run: npm run icons:check

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  # Its own job, so that an advisory published against an unchanged tree turns audit red
  # on the next run (on the default branch, the weekly one at the latest) and leaves check
  # meaning what it always meant. The gate runs npm audit, which reads the lockfile (no
  # install), and fails on every high or critical advisory .github/audit/accepted.json does
  # not accept (CONVENTIONS.md, "CI").
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - run: node .github/audit/npm-audit.mjs
