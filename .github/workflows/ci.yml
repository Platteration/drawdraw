name: CI

on:
  push:
    branches:
      - claude/portrait-segmentation-overlay-4kh36c
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      # Check runtime and test tooling. High/critical advisories remain blocking
      # until resolved or handled through a documented, scoped exception.
      - name: Dependency audit
        run: npm audit --audit-level=high
      # Pinned so a new expo-doctor release cannot change what CI checks. Two of
      # its checks (the app.json schema, fetched from exp.host, and the package
      # metadata from reactnative.directory) need network and fail spuriously
      # without it, so this step reports rather than blocks.
      - name: Expo project health (non-blocking)
        run: npx expo-doctor@1.20.4
        continue-on-error: true
      - name: Unit tests
        run: npx jest --ci
      - name: Bundle for iOS and Android
        run: npx expo export --platform ios --platform android --output-dir .export-check
      - name: Icons still match the model
        run: npm run icons:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the app in a browser
        run: npm run e2e
