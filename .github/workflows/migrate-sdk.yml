name: Migrate Expo SDK

on:
  push:
    branches:
      - codex/release-readiness

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Upgrade Expo SDK and align dependencies
        run: npx expo install expo@^57.0.17 --fix
      - name: Commit generated dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Expo stack to SDK 57"
          git push origin HEAD:codex/release-readiness
      - name: Expo project health
        run: npx expo-doctor@latest
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Bundle for iOS and Android
        run: npx expo export --platform ios --platform android --output-dir .export-check
