<!DOCTYPE html>
<!-- The page a host shows for an address the site does not have. No script: it works whatever
     failed. Its addresses are root-absolute so it works at any depth; scripts/build-web.mjs points
     them at the site's base path and adds the policy as <meta> tags. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4efe6" />
    <title>Page not found · DrawDraw</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body class="not-found">
    <main>
      <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
        <ellipse cx="48" cy="48" rx="31" ry="42" fill="none" stroke="#b4543a" stroke-width="2.5" />
        <path d="M17 34h62M17 62h62" fill="none" stroke="#b4543a" stroke-width="2.5" />
        <path d="M48 6v84" fill="none" stroke="#b4543a" stroke-width="1.5" stroke-dasharray="4 4" />
      </svg>
      <h1>That page isn’t here</h1>
      <p>The address may be mistyped, or the page may have moved. Everything in DrawDraw lives on one page.</p>
      <p><a class="button" href="/">Open DrawDraw</a></p>
    </main>
  </body>
</html>
